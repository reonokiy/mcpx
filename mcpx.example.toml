schema_version = 1

[profiles.default.servers.remote]
transport = "http"
url = "https://example.com/mcp"
protocol = "auto"
credential = "env:MCP_TOKEN"

[profiles.default.servers.demo]
transport = "stdio"
program = "python3"
args = ["tests/fixtures/stdio_server.py"]
working_directory = "."
protocol = "auto"
