[package]
name = "mcpx-native"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
mcpx-core = { path = "../mcpx-core" }
mcpx-protocol = { path = "../mcpx-protocol" }
mcpx-command = { path = "../mcpx-command" }
mcpx-config = { path = "../mcpx-config" }
serde_json = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
futures-util = { workspace = true }
serde = { workspace = true }
tokio-util = { version = "0.7", features = ["rt"] }
sha2 = "0.10"
mcpx-auth = { path = "../mcpx-auth" }
url = "2"
fs2 = "0.4"
tempfile = "3"
open = "5"
keyring = { version = "=3.6.3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust", "vendored"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread"] }
rmcp = { version = "=3.10.0", default-features = false, features = ["server", "transport-io", "transport-streamable-http-server"] }
axum = "0.8"

[[test]]
name = "sdk_stdio"
path = "tests/sdk_stdio.rs"
harness = false
