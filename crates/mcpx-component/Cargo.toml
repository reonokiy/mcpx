[package]
name = "mcpx-component"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints.rust]
# Canonical ABI exports contain unsafe code generated by wit-bindgen.
unsafe_code = "allow"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
mcpx-core = { path = "../mcpx-core" }
mcpx-protocol = { path = "../mcpx-protocol" }
mcpx-command = { path = "../mcpx-command" }
serde_json = { workspace = true }
wit-bindgen = { workspace = true }
